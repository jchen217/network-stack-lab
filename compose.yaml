services:
  web:
    build: ./web
    environment:
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 1).close()"]
      interval: 2s
      timeout: 2s
      retries: 15
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - counter_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  counter_data:
